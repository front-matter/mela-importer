[project]
name = "mela-importer"
version = "0.1.0"
description = "Mela → Mealie bulk importer"
requires-python = ">=3.14"
dependencies = ["requests>=2.32"]

[project.scripts]
mela-importer = "mela_importer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["app"]
include = ["app/mela_importer.py"]

[dependency-groups]
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 88
